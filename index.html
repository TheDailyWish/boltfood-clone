<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B44F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<title>FastCourier — замовлення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- Токени: світла тема, потім темна ---------- */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#0F1626; --muted:#5B6578; --line:#DCE1EA;
  --primary:#2B44F0; --on-primary:#FFFFFF; --halo:rgba(43,68,240,.18);
  --new-fg:#8A5200; --new-bg:#FFEFD0; --go-fg:#1D36C7; --go-bg:#E2E7FF; --done-fg:#0B6B49; --done-bg:#D9F3E8;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --danger:#D92D3A; --map-land:#E7ECE5; --map-street:#F7F9F5; --map-water:#B9D5EC; --map-park:#CDE5C6; --zone:rgba(255,166,43,.3); --zone-line:#D9822B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C111C; --surface:#151C2B; --ink:#EEF1F8; --muted:#9AA5BA; --line:#263048;
    --primary:#7B8DFF; --on-primary:#0C111C; --halo:rgba(123,141,255,.22);
    --new-fg:#FFC15A; --new-bg:#3A2B10; --go-fg:#AEBAFF; --go-bg:#212B5C; --done-fg:#5FD9A4; --done-bg:#12372A;
    --map-land:#1A2130; --map-street:#252E3F; --map-water:#1E3652; --map-park:#1E3A2C; --zone:rgba(255,166,43,.22); --zone-line:#E0903A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111C; --surface:#151C2B; --ink:#EEF1F8; --muted:#9AA5BA; --line:#263048;
  --primary:#7B8DFF; --on-primary:#0C111C; --halo:rgba(123,141,255,.22);
  --new-fg:#FFC15A; --new-bg:#3A2B10; --go-fg:#AEBAFF; --go-bg:#212B5C; --done-fg:#5FD9A4; --done-bg:#12372A;
  --map-land:#1A2130; --map-street:#252E3F; --map-water:#1E3652; --map-park:#1E3A2C; --zone:rgba(255,166,43,.22); --zone-line:#E0903A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ---------- Каркас ---------- */
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.today{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0 0 18px}
.today strong{font-weight:800}


/* Вкладки */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;background:var(--line);border-radius:14px}
.tab{border:0;background:none;padding:10px 8px;border-radius:11px;color:var(--muted);font:600 15px var(--font);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}

/* ---------- Картка замовлення у списку ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{display:block;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.shop{font-size:17px;font-weight:700}
.chip{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.is-new{background:var(--new-bg);color:var(--new-fg)}
.is-go{background:var(--go-bg);color:var(--go-fg)}
.is-done{background:var(--done-bg);color:var(--done-fg)}
.foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.meta{color:var(--muted);font-size:14px}
.fee{font-size:20px;font-weight:800}

/* Маршрут: рейка між точками забору та доставки */
.route{list-style:none;margin:0;padding:0}
.stop{position:relative;padding:0 0 14px 28px}
.stop:last-child{padding-bottom:0}
.stop::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop.passed::before{background:var(--primary)}
.dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:var(--primary)}
.stop.drop .dot{background:var(--surface);border:3px solid var(--primary)}
.stop.now .dot{box-shadow:0 0 0 5px var(--halo)}
.stop small{display:block;color:var(--muted);font-size:13px}
.stop p{margin:0;font-weight:500}

/* Порожній стан */
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font-size:17px}

/* ---------- Деталі замовлення ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 0;color:var(--ink);font-weight:600;text-decoration:none}
.title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.panel{margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.note{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.notice{margin-top:14px;padding:12px 14px;background:var(--new-bg);color:var(--new-fg);border-radius:12px;font-weight:500}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:600}
.sum .total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink);font-size:18px;font-weight:800}

/* Нижня панель дій */
.bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:10px;width:min(100%,480px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.btn{flex:1;padding:16px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font:700 16px var(--font);cursor:pointer}
.btn.ghost{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.done-note{width:100%;margin:0;padding:16px 0;text-align:center;color:var(--done-fg);font-weight:600}

/* Сповіщення */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:90%;padding:10px 16px;background:var(--ink);color:var(--bg);border-radius:12px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Карта ---------- */
.map-mode{overflow:hidden}
.screen{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow:hidden}
.fab{position:absolute;display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.fab.menu{top:calc(16px + env(safe-area-inset-top,0px));left:16px}
.over{position:absolute;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:space-between}
.over .fab{position:static}
.fab.on{color:var(--primary)}
.status{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:99px;background:var(--surface);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.btn.round{width:100%;border-radius:99px;padding:18px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.scrim{position:absolute;inset:0;background:rgba(10,14,24,.45)}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:20px;overflow:hidden;text-align:center}
.dialog h2{margin:0;padding:28px 20px;font-size:21px;line-height:1.3}
.dbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.dbtns button{padding:16px;border:0;background:none;color:var(--primary);font:700 17px var(--font);cursor:pointer}
.dbtns button+button{border-left:1px solid var(--line)}

/* ---------- Підготовка до виходу онлайн ---------- */
.tb{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:18px}
.tb h1{margin:0;text-align:center;font-size:19px;font-weight:700}
.tbb{display:grid;place-items:center;width:44px;height:44px;color:var(--ink)}
.vrow{display:flex;align-items:center;gap:14px;padding:14px 0;color:var(--ink);text-decoration:none}
.vrow span:nth-child(2){flex:1;display:flex;flex-direction:column}.vrow small{color:var(--muted);font-size:15px}
.ico{width:32px;text-align:center;font-size:24px}
.sec{margin:28px 0 8px;font-size:21px;font-weight:700}
.checks,.opts{list-style:none;margin:0;padding:0}
.check,.opt{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 17px var(--font);text-align:left;cursor:pointer}
.check{justify-content:space-between}.check svg{flex:none;color:var(--done-fg)}.check.bad svg{color:var(--danger)}
.opt span:nth-child(2){flex:1}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--muted);border-radius:50%;background:var(--surface)}
.opt input:checked{border:8px solid var(--primary)}

/* ---------- Меню та налаштування ---------- */
.who{display:flex;align-items:center;gap:16px;margin:8px 0 18px}
.who b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.who span:not(.avatar){color:var(--muted)}
.avatar{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:50%;background:var(--primary);font-size:30px}
.mrow{display:flex;align-items:center;gap:16px;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 18px var(--font);text-align:left;text-decoration:none;cursor:pointer}
.mrow span:nth-child(2){flex:1}.mrow svg:last-child{color:var(--muted)}
.opt .grow{flex:1}
.sheet{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.sheet.rise{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

/* ---------- Mapbox ---------- */
#map{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto}
#map.off{visibility:hidden;pointer-events:none}
.screen{pointer-events:none}.screen>*{pointer-events:auto}
.over{pointer-events:none}.over>*{pointer-events:auto}
.me{width:22px;height:22px;border:4px solid #fff;border-radius:50%;background:var(--primary);box-shadow:0 0 0 10px var(--halo)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" class="off"></div>
<main class="app" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- Утиліти ---------- */
const MIN = 60000;
const fmtMoney = n => new Intl.NumberFormat('uk-UA').format(n) + ' ₴';
const fmtTime = t => new Date(t).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
const fmtKm = n => n.toLocaleString('uk-UA') + ' км';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, [one, few, many]) => {
  const m = n % 100, d = n % 10;
  return m > 10 && m < 20 ? many : d === 1 ? one : d > 1 && d < 5 ? few : many;
};

/* ---------- Модель: статуси та переходи ---------- */
const STATUS = {
  assigned:  { label: 'Нове',            cls: 'is-new', cta: 'Прийняти замовлення', next: 'to_pickup', toast: 'Замовлення прийнято' },
  to_pickup: { label: 'Прямуєте до ресторану', cls: 'is-go',  cta: 'Забрав замовлення',  next: 'to_client', toast: 'Замовлення забрано' },
  to_client: { label: 'Везете клієнту',   cls: 'is-go',  cta: 'Доставив',      next: 'delivered', toast: 'Замовлення доставлено' },
  delivered: { label: 'Доставлено',        cls: 'is-done' }
};
const isDone = o => o.status === 'delivered';
const inProgress = o => o.status === 'to_pickup' || o.status === 'to_client';

/* ---------- Тестові дані (вигадані) ---------- */
const t0 = Date.now();
const state = {
  tab: 'active',
  online: false,
  vehicle: 'foot',
  draft: null,
  profile: { name: 'Тарас Мельник', phone: '+380 50 000 00 00' },
  location: null, // null — реальна геолокація, інакше id пресету
  pos: null,
  acc: null,
  perm: 'prompt',
  dialog: false,
  checks: [
    { text: 'Доступ до геолокації надано, GPS увімкнено', ok: true },
    { text: 'Точну геопозицію увімкнено', ok: true },
    { text: 'Режим економії енергії вимкнено', ok: true }
  ],
  orders: [
    { id: 2417, shop: 'Пекарня «Борошно»', from: 'вул. Садова, 14', to: 'вул. Лісова, 8, кв. 42', client: 'Анна',
      note: 'Домофон 42, 3 поверх. Зателефонуйте за 2 хвилини', items: 3, km: 3.2, eta: 18, fee: 69, tip: 20, cash: 0, status: 'assigned', at: t0 - 2 * MIN },
    { id: 2416, shop: 'Суші Норі', from: 'просп. Миру, 31', to: 'вул. Річкова, 5, кв. 17', client: 'Ігор',
      note: '', items: 2, km: 5.4, eta: 26, fee: 94, tip: 0, cash: 480, status: 'assigned', at: t0 - 5 * MIN },
    { id: 2415, shop: 'Бургерна «Гриль 24»', from: 'вул. Шкільна, 3', to: 'вул. Паркова, 27, кв. 9', client: 'Марія',
      note: 'Залиште біля дверей', items: 4, km: 2.1, eta: 12, fee: 58, tip: 15, cash: 0, status: 'assigned', at: t0 - 25 * MIN },
    { id: 2410, shop: 'Кав’ярня «Зерно»', from: 'вул. Нова, 7', to: 'вул. Південна, 12, кв. 5', client: 'Олег',
      note: '', items: 2, km: 1.8, eta: 10, fee: 72, tip: 0, cash: 0, status: 'delivered', at: t0 - 70 * MIN, done: t0 - 40 * MIN },
    { id: 2408, shop: 'Піца Б’янка', from: 'вул. Центральна, 2', to: 'вул. Зарічна, 19, кв. 3', client: 'Олена',
      note: '', items: 1, km: 4.6, eta: 22, fee: 85, tip: 25, cash: 0, status: 'delivered', at: t0 - 130 * MIN, done: t0 - 95 * MIN },
    { id: 2405, shop: 'Локшина Хару', from: 'просп. Миру, 18', to: 'вул. Озерна, 4, кв. 31', client: 'Павло',
      note: '', items: 3, km: 2.9, eta: 15, fee: 63, tip: 0, cash: 0, status: 'delivered', at: t0 - 190 * MIN, done: t0 - 160 * MIN }
  ]
};
const byId = id => state.orders.find(o => o.id === id);

/* ---------- Логіка ---------- */
function advance(id) {
  const o = byId(id), s = STATUS[o.status];
  if (!s.next) return;
  if (o.status === 'assigned' && state.orders.some(inProgress)) return toast('Спочатку завершіть поточне замовлення');
  o.status = s.next;
  if (isDone(o)) o.done = Date.now();
  toast(s.toast);
}
function reject(id) {
  state.orders = state.orders.filter(o => o.id !== id);
  toast('Замовлення відхилено');
  location.hash = '#/orders';
}
function askOffline() {
  if (state.orders.some(inProgress)) return toast('Завершіть поточне замовлення, щоб вийти офлайн');
  state.dialog = true;
}

/* ---------- Екрани ---------- */
const ARROW = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 6 10l6 6"/></svg>';

function route(o) {
  const toClient = o.status === 'to_client', finished = isDone(o);
  const pickupNow = o.status === 'assigned' || o.status === 'to_pickup';
  return '<ol class="route">' +
    '<li class="stop' + (toClient || finished ? ' passed' : '') + (pickupNow ? ' now' : '') + '"><i class="dot"></i><div>' +
      '<small>Забрати: ' + esc(o.shop) + '</small><p>' + esc(o.from) + '</p></div></li>' +
    '<li class="stop drop' + (toClient ? ' now' : '') + '"><i class="dot"></i><div>' +
      '<small>Доставити: ' + esc(o.client) + '</small><p>' + esc(o.to) + '</p></div></li>' +
    '</ol>';
}

function card(o) {
  const s = STATUS[o.status];
  const meta = isDone(o) ? 'Доставлено о ' + fmtTime(o.done) : fmtKm(o.km) + ', близько ' + o.eta + ' хв';
  return '<li><a class="card" href="#/order/' + o.id + '">' +
    '<div class="row"><span class="shop">' + esc(o.shop) + '</span><span class="chip ' + s.cls + '">' + s.label + '</span></div>' +
    route(o) +
    '<div class="foot"><span class="meta">' + meta + '</span><span class="fee">' + fmtMoney(o.fee + o.tip) + '</span></div>' +
    '</a></li>';
}

function viewList() {
  const finished = state.orders.filter(isDone).sort((a, b) => b.done - a.done);
  const open = state.orders
    .filter(o => !isDone(o) && (state.online || inProgress(o)))
    .sort((a, b) => inProgress(b) - inProgress(a) || b.at - a.at);
  const list = state.tab === 'active' ? open : finished;

  const todayStr = new Date().toDateString();
  const today = finished.filter(o => new Date(o.done).toDateString() === todayStr);
  const sum = today.reduce((s, o) => s + o.fee + o.tip, 0);
  const todayText = today.length
    ? 'Сьогодні ви заробили <strong>' + fmtMoney(sum) + '</strong> за ' + today.length + ' ' + plural(today.length, ['доставку', 'доставки', 'доставок'])
    : 'Сьогодні ще не було доставок';

  let empty = ['Виконаних замовлень поки немає', 'Доставлені замовлення з’являться в цьому списку.'];
  if (state.tab === 'active') {
    empty = state.online
      ? ['Нових замовлень поки немає', 'Вони з’являться тут, щойно надійдуть.']
      : ['Ви офлайн', 'Вийдіть онлайн на карті, щоб отримувати нові замовлення.'];
  }
  const body = list.length
    ? '<ul class="list">' + list.map(card).join('') + '</ul>'
    : '<div class="empty"><b>' + empty[0] + '</b>' + empty[1] + '</div>';

  const tab = (id, text, n) =>
    '<button role="tab" class="tab" data-act="tab" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' + text + ' (' + n + ')</button>';

  return '<header class="top"><span class="brand">FastCourier</span><a class="back" href="#/">Карта</a></header>' +
    '<p class="today">' + todayText + '</p>' +
    '<div class="tabs" role="tablist">' + tab('active', 'Активні', open.length) + tab('done', 'Виконані', finished.length) + '</div>' +
    '<div role="tabpanel">' + body + '</div>';
}

function viewDetail(o) {
  const s = STATUS[o.status];
  const attr = ' data-id="' + o.id + '"';
  let actions;
  if (isDone(o)) {
    actions = '<p class="done-note">Доставлено о ' + fmtTime(o.done) + '</p>';
  } else {
    actions = (o.status === 'assigned' ? '<button class="btn ghost" data-act="reject"' + attr + '>Відхилити</button>' : '') +
      '<button class="btn" data-act="advance"' + attr + '>' + s.cta + '</button>';
  }
  return '<a class="back" href="#/orders">' + ARROW + 'Замовлення</a>' +
    '<div class="row"><h1 class="title">Замовлення №' + o.id + '</h1><span class="chip ' + s.cls + '">' + s.label + '</span></div>' +
    '<section class="panel">' + route(o) +
      (o.note ? '<p class="note">Коментар клієнта: ' + esc(o.note) + '</p>' : '') + '</section>' +
    (o.cash && !isDone(o) ? '<p class="notice">Клієнт платить готівкою: візьміть ' + fmtMoney(o.cash) + '</p>' : '') +
    '<section class="panel"><dl class="sum">' +
      '<dt>Позицій у замовленні</dt><dd>' + o.items + '</dd>' +
      '<dt>Відстань</dt><dd>' + fmtKm(o.km) + '</dd>' +
      '<dt>Час у дорозі</dt><dd>близько ' + o.eta + ' хв</dd></dl></section>' +
    '<section class="panel"><dl class="sum">' +
      '<dt>Доставка</dt><dd>' + fmtMoney(o.fee) + '</dd>' +
      (o.tip ? '<dt>Чайові</dt><dd>' + fmtMoney(o.tip) + '</dd>' : '') +
      '<dt class="total">Ваш заробіток</dt><dd class="total">' + fmtMoney(o.fee + o.tip) + '</dd></dl></section>' +
    '<div class="bar">' + actions + '</div>';
}

/* ---------- Роутер, події, сповіщення ---------- */
const root = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastTimer;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------- Карта, вихід онлайн, спосіб доставки ---------- */
const VEHICLES = [
  { id: 'car', label: 'Автомобіль', ico: '🚗' },
  { id: 'moto', label: 'Мотоцикл', ico: '🏍️' },
  { id: 'scooter', label: 'Електросамокат', ico: '🛴' },
  { id: 'bike', label: 'Велосипед', ico: '🚲' },
  { id: 'ebike', label: 'Електровелосипед', ico: '🚲⚡' },
  { id: 'foot', label: 'Пішки', ico: '🚶' }
];
const svg = d => '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const topbar = (href, label, icon, title) =>
  '<header class="tb"><a class="tbb" href="' + href + '" aria-label="' + label + '">' + icon + '</a><h1>' + title + '</h1><span></span></header>';
/* ---------- Mapbox і геолокація ---------- */
mapboxgl.accessToken = 'pk.eyJ1IjoidGhlZGFpbHl3aXNoIiwiYSI6ImNtdjhpb3BuZjBzczcyeXNnNzdnNnZ6NWoifQ.IO7yuRNTqssk1ODG30z33w'; // публічний токен (pk.), обмеж його за URL у кабінеті Mapbox
let map, meMarker, watchId = null;

function initMap() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  map = new mapboxgl.Map({
    container: 'map', style: 'mapbox://styles/mapbox/' + (dark ? 'dark-v11' : 'streets-v12'),
    center: here(), zoom: 13, attributionControl: false, logoPosition: 'top-right'
  });
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'top-right');
  const dot = document.createElement('div');
  dot.className = 'me';
  meMarker = new mapboxgl.Marker({ element: dot }).setLngLat(here()).addTo(map);
  map.on('move', syncLocateButton);
}

// карта відцентрована на користувачі, якщо його точка збігається з центром екрана
function isCentered() {
  if (!map) return true;
  const a = map.project(here()), c = map.project(map.getCenter());
  return Math.hypot(a.x - c.x, a.y - c.y) < 8;
}
function syncLocateButton() {
  const b = document.querySelector('[data-act="locate"]');
  if (b) b.classList.toggle('on', isCentered());
}
function updateMe() { if (meMarker) meMarker.setLngLat(here()); }
function flyToMe() {
  updateMe();
  map.flyTo({ center: here(), zoom: Math.max(map.getZoom(), 14), essential: true });
}
const recenter = flyToMe;

const geoOk = () => state.perm === 'granted' && state.acc != null && state.acc <= 100;
function startWatch() {
  if (!navigator.geolocation) return toast('Геолокація недоступна на цьому пристрої');
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  let first = state.pos === null;
  watchId = navigator.geolocation.watchPosition(p => {
    const before = geoOk();
    state.pos = [p.coords.longitude, p.coords.latitude];
    state.acc = p.coords.accuracy;
    state.perm = 'granted';
    updateMe();
    if (first && !state.location) { first = false; flyToMe(); }
    if (location.hash === '#/setup' && geoOk() !== before) render();
  }, err => {
    const before = geoOk();
    if (err.code === 1) state.perm = 'denied';
    toast(err.code === 1 ? 'Дозвольте доступ до геолокації' : 'Не вдалося визначити місцезнаходження');
    if (location.hash === '#/setup' && geoOk() !== before) render();
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function viewHome() {
  const burger = svg('<path d="M4 7h16M4 12h16M4 17h16"/>');
  const target = svg('<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>');
  const main = state.online
    ? '<button class="btn round danger" data-act="offline">Вийти офлайн</button>'
    : '<button class="btn round" data-act="online">Вийти онлайн</button>';
  const dialog = state.dialog
    ? '<div class="scrim"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Ви дійсно бажаєте вийти офлайн?</h2>' +
      '<div class="dbtns"><button data-act="dialog-no">Ні</button><button data-act="offline-yes">Так</button></div></div>'
    : '';
  return '<div class="screen">' +
    '<a class="fab menu" href="#/menu" aria-label="Відкрити меню">' + burger + '</a>' +
    '<div class="over">' + (state.online ? '<div class="status"><i class="spin"></i>Пошук замовлень</div>' : '<span></span>') +
      '<button class="fab' + (isCentered() ? ' on' : '') + '" data-act="locate" aria-label="Показати моє місцезнаходження">' + target + '</button></div>' +
    '<div class="bottom">' + main + '</div>' + dialog + '</div>';
}

function viewSetup() {
  const v = VEHICLES.find(x => x.id === state.vehicle);
  state.checks[0].ok = state.perm === 'granted'; // доступ до геолокації
  state.checks[1].ok = state.acc != null && state.acc <= 100; // точність до 100 м
  const allOk = state.checks.every(c => c.ok);
  const rows = state.checks.map((c, i) =>
    '<li><button class="check' + (c.ok ? '' : ' bad') + '" data-act="check" data-id="' + i + '"><span>' + c.text + '</span>' +
    svg(c.ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M6 6l12 12M18 6 6 18"/>') + '</button></li>').join('');
  return topbar('#/', 'Закрити', svg('<path d="M6 6l12 12M18 6 6 18"/>'), 'Перед тим як ви почнете') +
    '<a class="vrow" href="#/vehicle"><span class="ico">' + v.ico + '</span><span><b>Спосіб доставки</b><small>' + v.label + '</small></span>' + svg('<path d="M9 5l7 7-7 7"/>') + '</a>' +
    '<h2 class="sec">Перевірте свої налаштування</h2><ul class="checks">' + rows + '</ul>' +
    '<div class="bar"><button class="btn round" data-act="confirm"' + (allOk ? '' : ' disabled') + '>Підтвердити</button></div>';
}

function viewVehicle() {
  const opts = VEHICLES.map(v =>
    '<li><label class="opt"><span class="ico">' + v.ico + '</span><span>' + v.label + '</span>' +
    '<input type="radio" name="vehicle" value="' + v.id + '"' + (state.draft === v.id ? ' checked' : '') + '></label></li>').join('');
  return topbar('#/setup', 'Назад', ARROW, 'Спосіб доставки') + '<ul class="opts">' + opts + '</ul>' +
    '<div class="bar"><button class="btn round" data-act="save-vehicle"' + (state.draft === state.vehicle ? ' disabled' : '') + '>Зберегти спосіб доставки</button></div>';
}

const MENU = [
  { id: 'deliveries', label: 'Всі доставки', d: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>' },
  { id: 'income', label: 'Дохід', d: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>' },
  { id: 'balance', label: 'Баланс', d: '<path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-3v3M16 14h2"/>' },
  { id: 'campaigns', label: 'Кампанії', d: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>' },
  { id: 'inbox', label: 'Вхідні', d: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>' },
  { id: 'stats', label: 'Статистика', d: '<path d="M4 4v16h16"/><path d="M8 15l4-4 3 3 5-6"/>' },
  { id: 'profile', label: 'Профіль', d: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' },
  { id: 'settings', label: 'Налаштування', d: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>' },
  { id: 'help', label: 'Допомога', d: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>' },
  { id: 'invite', label: 'Запросити друзів', d: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9C9 9 8 4 11 4c2 0 1 5 1 5zm0 0c3 0 4-5 1-5-2 0-1 5-1 5z"/>' },
  { id: 'loyalty', label: 'Програма лояльності', d: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>' },
  { id: 'about', label: 'Про нас', d: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>' }
];

function viewMenu(animate) {
  const v = VEHICLES.find(x => x.id === state.vehicle);
  const rows = MENU.map(m => {
    const inner = '<span class="mi">' + svg(m.d) + '</span><span>' + m.label + '</span>' + svg('<path d="M9 5l7 7-7 7"/>');
    return '<li>' + (m.id === 'settings'
      ? '<a class="mrow" href="#/settings">' + inner + '</a>'
      : '<button class="mrow" data-act="soon">' + inner + '</button>') + '</li>';
  }).join('');
  return '<div class="sheet' + (animate ? ' rise' : '') + '" role="dialog" aria-modal="true" aria-label="Головне меню"><a class="tbb" href="#/" aria-label="Закрити">' + svg('<path d="M6 6l12 12M18 6 6 18"/>') + '</a>' +
    '<div class="who"><span class="avatar" aria-hidden="true">' + v.ico + '</span><div><b>' + esc(state.profile.name) + '</b><span>' + esc(state.profile.phone) + '</span></div></div>' +
    '<ul class="checks">' + rows + '</ul></div>';

// Пресети геолокації: приблизні точки відносно центру міста (заміни на координати потрібних закладів)
const CITY = [28.4682, 49.2331];
const km = (dx, dy) => [CITY[0] + dx / (111.32 * Math.cos(CITY[1] * Math.PI / 180)), CITY[1] + dy / 110.57];
const LOCATIONS = [
  { id: 'kyivska', name: 'Київська', at: km(-2.0, 2.2) },
  { id: 'center', name: 'Центр', at: km(0, 0) },
  { id: 'keltsia', name: 'Келецька', at: km(2.5, -2.8) }
];
// де зараз користувач: пресет, реальна позиція або центр міста
const here = () => { const l = LOCATIONS.find(x => x.id === state.location); return l ? l.at : state.pos || CITY; };

function viewSettings() {
  const opts = LOCATIONS.map(l =>
    '<li><label class="opt"><span class="grow">' + l.name + '</span><input type="radio" name="location" value="' + l.id + '"' + (state.location === l.id ? ' checked' : '') + '></label></li>').join('');
  return topbar('#/menu', 'Назад', ARROW, 'Макдональдс') + '<ul class="opts">' + opts + '</ul>';
}

// попередній маршрут: меню випливає знизу лише при відкритті з карти, а не при поверненні з налаштувань
let prevHash = null;

function render() {
  const h = location.hash;
  const m = h.match(/^#\/order\/(\d+)/);
  const order = m && byId(Number(m[1]));
  const home = !order && !['#/orders', '#/setup', '#/vehicle', '#/settings'].includes(h);
  if (h !== '#/vehicle') state.draft = null; else if (state.draft == null) state.draft = state.vehicle;
  if (!home) state.dialog = false;
  document.body.classList.toggle('map-mode', home);
  document.getElementById('map').classList.toggle('off', !home);
  root.innerHTML = order ? viewDetail(order) : h === '#/orders' ? viewList() : h === '#/setup' ? viewSetup() : h === '#/vehicle' ? viewVehicle() : h === '#/menu' ? viewHome() + viewMenu(h !== prevHash && prevHash !== '#/settings') : h === '#/settings' ? viewSettings() : viewHome();
  prevHash = h;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const { act, id, tab } = b.dataset;
  if (act === 'tab') state.tab = tab;
  if (act === 'online') location.hash = '#/setup';
  if (act === 'offline') askOffline();
  if (act === 'offline-yes') { state.online = false; state.dialog = false; toast('Ви офлайн'); }
  if (act === 'dialog-no') state.dialog = false;
  if (act === 'soon') return toast('Розділ ще в розробці');
  if (act === 'locate') return recenter();
  if (act === 'check') { if (id === '2') state.checks[2].ok = !state.checks[2].ok; else startWatch(); }
  if (act === 'confirm') { state.online = true; location.hash = '#/'; toast('Ви на лінії'); }
  if (act === 'save-vehicle') { state.vehicle = state.draft; location.hash = '#/setup'; toast('Спосіб доставки збережено'); }
  if (act === 'advance') advance(Number(id));
  if (act === 'reject') reject(Number(id));
  render();
  // після перемальовування повертаємо фокус на той самий елемент (важливо для клавіатури)
  const sel = '[data-act="' + act + '"]' + (tab ? '[data-tab="' + tab + '"]' : '') + (id ? '[data-id="' + id + '"]' : '');
  const again = root.querySelector('[role="alertdialog"] button') || root.querySelector(sel);
  if (again) again.focus();
});

// вибір способу доставки (нативні radio)
document.addEventListener('change', e => {
  if (!e.target.matches('input[name="vehicle"]')) return;
  state.draft = e.target.value;
  render();
  root.querySelector('input[name="vehicle"]:checked').focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.dialog) { state.dialog = false; render(); }
  if (e.key === 'Escape' && location.hash === '#/menu') location.hash = '#/';
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[role="button"]')) {
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});

// вибір геолокації: точка користувача переміщується, карта центрується на ній
document.addEventListener('change', e => {
  if (!e.target.matches('input[name="location"]')) return;
  state.location = e.target.value;
  flyToMe();
  toast('Геолокацію змінено: ' + here().name);
  render();
  root.querySelector('input[name="location"]:checked').focus();
});

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
initMap();
startWatch();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
