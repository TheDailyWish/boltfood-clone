<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<title>FastCourier — замовлення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- Токени: світла тема, потім темна ---------- */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#0F1626; --muted:#5B6578; --line:#DCE1EA;
  --primary:#2B44F0; --on-primary:#FFFFFF; --halo:rgba(43,68,240,.18);
  --new-fg:#8A5200; --new-bg:#FFEFD0; --go-fg:#1D36C7; --go-bg:#E2E7FF; --done-fg:#0B6B49; --done-bg:#D9F3E8;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --danger:#D92D3A; --map-land:#E7ECE5; --map-street:#F7F9F5; --map-water:#B9D5EC; --map-park:#CDE5C6; --zone:rgba(255,166,43,.3); --zone-line:#D9822B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C111C; --surface:#151C2B; --ink:#EEF1F8; --muted:#9AA5BA; --line:#263048;
    --primary:#7B8DFF; --on-primary:#0C111C; --halo:rgba(123,141,255,.22);
    --new-fg:#FFC15A; --new-bg:#3A2B10; --go-fg:#AEBAFF; --go-bg:#212B5C; --done-fg:#5FD9A4; --done-bg:#12372A;
    --map-land:#1A2130; --map-street:#252E3F; --map-water:#1E3652; --map-park:#1E3A2C; --zone:rgba(255,166,43,.22); --zone-line:#E0903A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111C; --surface:#151C2B; --ink:#EEF1F8; --muted:#9AA5BA; --line:#263048;
  --primary:#7B8DFF; --on-primary:#0C111C; --halo:rgba(123,141,255,.22);
  --new-fg:#FFC15A; --new-bg:#3A2B10; --go-fg:#AEBAFF; --go-bg:#212B5C; --done-fg:#5FD9A4; --done-bg:#12372A;
  --map-land:#1A2130; --map-street:#252E3F; --map-water:#1E3652; --map-park:#1E3A2C; --zone:rgba(255,166,43,.22); --zone-line:#E0903A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ---------- Каркас ---------- */
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.today{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0 0 18px}
.today strong{font-weight:800}


/* Вкладки */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;background:var(--line);border-radius:14px}
.tab{border:0;background:none;padding:10px 8px;border-radius:11px;color:var(--muted);font:600 15px var(--font);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}

/* ---------- Картка замовлення у списку ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{display:block;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.shop{font-size:17px;font-weight:700}
.chip{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.is-new{background:var(--new-bg);color:var(--new-fg)}
.is-go{background:var(--go-bg);color:var(--go-fg)}
.is-done{background:var(--done-bg);color:var(--done-fg)}
.foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.meta{color:var(--muted);font-size:14px}
.fee{font-size:20px;font-weight:800}

/* Маршрут: рейка між точками забору та доставки */
.route{list-style:none;margin:0;padding:0}
.stop{position:relative;padding:0 0 14px 28px}
.stop:last-child{padding-bottom:0}
.stop::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop.passed::before{background:var(--primary)}
.dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:var(--primary)}
.stop.drop .dot{background:var(--surface);border:3px solid var(--primary)}
.stop.now .dot{box-shadow:0 0 0 5px var(--halo)}
.stop small{display:block;color:var(--muted);font-size:13px}
.stop p{margin:0;font-weight:500}

/* Порожній стан */
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font-size:17px}

/* ---------- Деталі замовлення ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 0;color:var(--ink);font-weight:600;text-decoration:none}
.title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.panel{margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.note{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.notice{margin-top:14px;padding:12px 14px;background:var(--new-bg);color:var(--new-fg);border-radius:12px;font-weight:500}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:600}
.sum .total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink);font-size:18px;font-weight:800}

/* Нижня панель дій */
.bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:10px;width:min(100%,480px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.btn{flex:1;padding:16px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font:700 16px var(--font);cursor:pointer}
.btn.ghost{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.done-note{width:100%;margin:0;padding:16px 0;text-align:center;color:var(--done-fg);font-weight:600}

/* Сповіщення */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:90%;padding:10px 16px;background:var(--ink);color:var(--bg);border-radius:12px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Карта ---------- */
.map-mode{overflow:hidden}
.screen{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow:hidden}
.fab{position:absolute;display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.fab.menu{top:calc(16px + env(safe-area-inset-top,0px));left:16px}
.over{position:absolute;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:space-between}
.over .fab{position:static}
.fab.on{color:var(--primary)}
.status{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:99px;background:var(--surface);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.btn.round{width:100%;border-radius:99px;padding:18px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.scrim{position:absolute;inset:0;background:rgba(10,14,24,.45)}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:20px;overflow:hidden;text-align:center}
.dialog h2{margin:0;padding:28px 20px;font-size:21px;line-height:1.3}
.dbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.dbtns button{padding:16px;border:0;background:none;color:var(--primary);font:700 17px var(--font);cursor:pointer}
.dbtns button+button{border-left:1px solid var(--line)}

/* ---------- Підготовка до виходу онлайн ---------- */
.tb{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:18px}
.tb h1{margin:0;text-align:center;font-size:19px;font-weight:700}
.tbb{display:grid;place-items:center;width:44px;height:44px;color:var(--ink)}
.vrow{display:flex;align-items:center;gap:14px;padding:14px 0;color:var(--ink);text-decoration:none}
.vrow span:nth-child(2){flex:1;display:flex;flex-direction:column}.vrow small{color:var(--muted);font-size:15px}
.ico{width:32px;text-align:center;font-size:24px}
.sec{margin:28px 0 8px;font-size:21px;font-weight:700}
.checks,.opts{list-style:none;margin:0;padding:0}
.check,.opt{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 17px var(--font);text-align:left;cursor:pointer}
.check{justify-content:space-between}.check svg{flex:none;color:var(--done-fg)}.check.bad svg{color:var(--danger)}
.opt span:nth-child(2){flex:1}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--muted);border-radius:50%;background:var(--surface)}
.opt input:checked{border:8px solid var(--primary)}

/* ---------- Меню та налаштування ---------- */
.who{display:flex;align-items:center;gap:16px;width:100%;margin:8px 0 18px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.who b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.avatar{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:50%;background:var(--primary);font-size:30px}
.mrow{display:flex;align-items:center;gap:16px;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 18px var(--font);text-align:left;text-decoration:none;cursor:pointer}
.mrow span:nth-child(2){flex:1}.mrow svg:last-child{color:var(--muted)}
.opt .grow{flex:1}
.wtxt{flex:1;min-width:0}
.who small{display:block;color:var(--muted);font-size:16px}
.pform{display:grid;gap:12px;margin:8px 0 18px}
.pform label{display:grid;gap:4px;color:var(--muted);font-size:14px}
.pform input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 17px var(--font)}
.pbtns{display:flex;gap:10px}
.pbtns .btn{flex:1;padding:14px}
.pcircles{display:flex;gap:12px}
.pcircle{width:52px;height:52px;border:2px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);font:700 17px var(--font);cursor:pointer}
.pcircle[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.pcircle.add{border-style:dashed;color:var(--muted);font-size:26px;line-height:1}
.pcircle.add[aria-pressed="true"]{color:var(--on-primary)}
.pdel{align-self:center;padding:8px;border:0;background:none;color:var(--danger);font:600 15px var(--font);cursor:pointer}
/* ---------- Доставки, готівка, оплата ---------- */
a.btn{display:block;text-align:center;text-decoration:none}
.bar.col{flex-direction:column}
.bar.col .notice{margin:0}
.sums{display:grid;gap:12px;margin-bottom:12px}
.sumcard{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--line);color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.sumcard small{display:block;color:var(--muted);font-size:15px}
.sumcard b{font-size:20px;font-weight:700}
.day{margin-top:24px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dayhead h2,.dayhead b{margin:0;font-size:21px;font-weight:700}
.cnt{margin:2px 0 4px;text-align:right;color:var(--muted);font-size:15px}
.ords{list-style:none;margin:0;padding:0}
.ord{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ord small{display:block;color:var(--muted);font-size:14px}
.ord>span{font-weight:700;white-space:nowrap}
.cashbox{display:grid;place-content:center;gap:16px;min-height:55vh;text-align:center}
.cashbox p{margin:0;color:var(--muted)}
.cashin{display:flex;align-items:baseline;justify-content:center;gap:6px;font-size:48px;font-weight:800}
.cashin input{width:6ch;padding:0;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:right}
.big{margin:8px 0 18px;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.info{margin:0 0 14px;padding:14px 16px;border-radius:14px;background:var(--go-bg);color:var(--go-fg)}
.days{list-style:none;margin:0;padding:0}
.dayrow{display:grid;grid-template-columns:1fr 84px 104px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow.head{color:var(--muted);font-size:13px}
.dayrow input{width:100%;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--font);text-align:right}
.sheet{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.sheet.rise{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

/* ---------- Mapbox ---------- */
#map{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto}
#map.off{visibility:hidden;pointer-events:none}
.screen{pointer-events:none}.screen>*{pointer-events:auto}
.over{pointer-events:none}.over>*{pointer-events:auto}
.me{width:22px;height:22px;border:4px solid #fff;border-radius:50%;background:var(--primary);box-shadow:0 0 0 10px var(--halo)}


/* ---------- Замовлення на карті ---------- */
.over.top{top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;justify-content:flex-end}
.decline{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:84px;right:16px;height:52px;border:0;border-radius:99px;background:var(--surface);color:var(--danger);font:700 18px var(--font);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.ocard,.osheet,.isheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18)}
.ocard{display:grid;gap:12px;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.orow{display:flex;gap:14px;align-items:flex-start}
.orow b{display:block;font-size:19px}.orow span{display:block}.orow small,.orow2{color:var(--muted)}
.oi{width:28px;text-align:center;font-size:22px}
.osheet{display:flex;flex-direction:column;max-height:88%;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.grab{align-self:center;width:60px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.grab::after{content:"";display:block;width:44px;height:5px;margin:10px auto 0;border-radius:3px;background:var(--line)}
.osum{display:grid;gap:6px;padding-bottom:10px}
.osum b{font-size:19px}.osum>span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{padding:6px 12px;border-radius:10px;background:var(--line);color:var(--ink);font-size:15px}
.chip2 b{font-size:15px}
.chip2.ok{background:var(--done-bg);color:var(--done-fg)}
.odet{max-height:0;overflow:hidden;transition:max-height .3s}
.exp .odet{max-height:55vh;overflow:auto}
.blk{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.orow2{display:flex;justify-content:space-between;align-items:center}
.lnk{display:inline-flex;align-items:center;gap:4px;padding:6px 0;border:0;background:none;color:var(--muted);font:500 16px var(--font);cursor:pointer}
.lnk.call{color:var(--primary);font-weight:700}
.hcard{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.lnk2{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 0;border:0;background:none;color:var(--ink);font:500 17px var(--font);cursor:pointer}
.info2{margin:0}.info2 dt{margin-top:10px;color:var(--muted);font-size:14px}.info2 dd{margin:0;font-size:17px}
.calls{display:flex;gap:16px;padding:14px 0}
.calls button{display:grid;gap:4px;justify-items:center;border:0;background:none;color:var(--ink);font:500 14px var(--font);cursor:pointer}
.calls span{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--line);font-size:22px}
.ofoot{padding-top:8px}
.wait{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px;text-align:center}
.slide{position:relative;display:grid;place-items:center;height:64px;border-radius:99px;background:var(--primary);color:var(--on-primary);overflow:hidden;touch-action:none}
.knob{position:absolute;left:6px;top:6px;display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:var(--primary);cursor:grab;touch-action:none}
.stxt{display:grid;text-align:center;pointer-events:none}.stxt b{font-size:19px}.stxt small{font-size:13px;opacity:.85}
.isheet{padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ihead{display:flex;justify-content:space-between;align-items:center}.ihead h2{margin:0;font-size:24px}
.ilist{list-style:none;margin:8px 0 16px;padding:0}.ilist li{padding:16px 0;border-bottom:1px solid var(--line);font-size:18px}
.bigd{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:#0E1110;color:#EDEFEE}
.bigd span{font-size:34vmin;font-weight:800;line-height:1;letter-spacing:.04em}
.bigd b{color:#38B27A;font-size:20vmin;line-height:1.1}
.bigd.rot90,.bigd.rotm90{right:auto;bottom:auto;width:100vh;height:100vw;transform-origin:0 0}
.bigd.rot90{transform:translateX(100vw) rotate(90deg)}
.bigd.rotm90{transform:translateY(100vh) rotate(-90deg)}
.grab,.osum{touch-action:none}
.pin{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pin.venue{background:#6B4EFF}.pin.client{background:#1E8F5A}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" class="off"></div>
<main class="app" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- Утиліти ---------- */
const MIN = 60000;
const fmtMoney = n => new Intl.NumberFormat('uk-UA').format(n) + ' ₴';
const fmtTime = t => new Date(t).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
const fmtKm = n => n.toLocaleString('uk-UA') + ' км';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, [one, few, many]) => {
  const m = n % 100, d = n % 10;
  return m > 10 && m < 20 ? many : d === 1 ? one : d > 1 && d < 5 ? few : many;
};

/* ---------- Логіка ---------- */
function advance(id) {
  const o = byId(id), s = STATUS[o.status];
  if (!s.next) return;
  if (o.status === 'assigned' && state.orders.some(inProgress)) return toast('Спочатку завершіть поточне замовлення');
  o.status = s.next;
  if (isDone(o)) o.done = Date.now();
  toast(s.toast);
}
function reject(id) {
  state.orders = state.orders.filter(o => o.id !== id);
  toast('Замовлення відхилено');
  location.hash = '#/orders';
}
function askOffline() {
  if (state.live && state.live.phase !== 'offer') return toast('Завершіть поточне замовлення, щоб вийти офлайн');
  state.dialog = true;
}

function route(o) {
  const toClient = o.status === 'to_client', finished = isDone(o);
  const pickupNow = o.status === 'assigned' || o.status === 'to_pickup';
  return '<ol class="route">' +
    '<li class="stop' + (toClient || finished ? ' passed' : '') + (pickupNow ? ' now' : '') + '"><i class="dot"></i><div>' +
      '<small>Забрати: ' + esc(o.shop) + '</small><p>' + esc(o.from) + '</p></div></li>' +

function card(o) {
  const s = STATUS[o.status];
  const meta = isDone(o) ? 'Доставлено о ' + fmtTime(o.done) : fmtKm(o.km) + ', близько ' + o.eta + ' хв';
  return '<li><a class="card" href="#/order/' + o.id + '">' +

function viewList() {
  const finished = state.orders.filter(isDone).sort((a, b) => b.done - a.done);
  const open = state.orders
    .filter(o => !isDone(o) && (state.online || inProgress(o)))
    .sort((a, b) => inProgress(b) - inProgress(a) || b.at - a.at);
  const list = state.tab === 'active' ? open : finished;

  const todayStr = new Date().toDateString();
  const today = finished.filter(o => new Date(o.done).toDateString() === todayStr);
  const sum = today.reduce((s, o) => s + o.fee + o.tip, 0);
  const todayText = today.length
    ? 'Сьогодні ви заробили <strong>' + fmtMoney(sum) + '</strong> за ' + today.length + ' ' + plural(today.length, ['доставку', 'доставки', 'доставок'])
    : 'Сьогодні ще не було доставок';

  let empty = ['Виконаних замовлень поки немає', 'Доставлені замовлення з’являться в цьому списку.'];
  if (state.tab === 'active') {
    empty = state.online
      ? ['Нових замовлень поки немає', 'Вони з’являться тут, щойно надійдуть.']
      : ['Ви офлайн', 'Вийдіть онлайн на карті, щоб отримувати нові замовлення.'];
  }
  const body = list.length
    ? '<ul class="list">' + list.map(card).join('') + '</ul>'
    : '<div class="empty"><b>' + empty[0] + '</b>' + empty[1] + '</div>';

  const tab = (id, text, n) =>
    '<button role="tab" class="tab" data-act="tab" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' + text + ' (' + n + ')</button>';

  return '<header class="top"><span class="brand">FastCourier</span><a class="back" href="#/">Карта</a></header>' +
    '<p class="today">' + todayText + '</p>' +
    '<div class="tabs" role="tablist">' + tab('active', 'Активні', open.length) + tab('done', 'Виконані', finished.length) + '</div>' +
    '<div role="tabpanel">' + body + '</div>';
}

// карта відцентрована на користувачі, якщо його точка збігається з центром екрана
function isCentered() {
  if (!map) return true;
  const a = map.project(here()), c = map.project(map.getCenter());
  return Math.hypot(a.x - c.x, a.y - c.y) < 8;
}
function syncLocateButton() {
  const b = document.querySelector('[data-act="locate"]');
  if (b) b.classList.toggle('on', isCentered());
}
function updateMe() {
  if (meMarker) meMarker.setLngLat(here());
  if (state.live) syncRoute(false); // лінія маршруту рухається разом із курʼєром
}
function flyToMe() {
  updateMe();
  map.flyTo({ center: here(), zoom: Math.max(map.getZoom(), 14), essential: true });
}
const recenter = flyToMe;

const geoOk = () => state.perm === 'granted' && state.acc != null && state.acc <= 100;
function startWatch() {
  if (!navigator.geolocation) return toast('Геолокація недоступна на цьому пристрої');
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  let first = state.pos === null;
  watchId = navigator.geolocation.watchPosition(p => {
    const before = geoOk();
    state.pos = [p.coords.longitude, p.coords.latitude];
    state.acc = p.coords.accuracy;
    state.perm = 'granted';
    updateMe();
    if (first && !state.location) { first = false; flyToMe(); }
    if (location.hash === '#/setup' && geoOk() !== before) render();
  }, err => {
    const before = geoOk();
    if (err.code === 1) state.perm = 'denied';
    toast(err.code === 1 ? 'Дозвольте доступ до геолокації' : 'Не вдалося визначити місцезнаходження');
    if (location.hash === '#/setup' && geoOk() !== before) render();
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

// Маршрут замовлення на карті Mapbox: лінія курʼєр → заклад → клієнт і дві мітки
const hereLL = () => here();
let routeMarkers = [];
const pin = (cls, ico) => { const el = document.createElement('div'); el.className = 'pin ' + cls; el.textContent = ico; return el; };
// точки маршруту рахуються від поточного положення курʼєра, тому лінія рухається разом із ним
function routePoints() {
  const L = state.live;
  if (!L) return [];
  return L.phase === 'to_client' || L.phase === 'at_client' ? [hereLL(), L.dest.at] : [hereLL(), L.venue.at, L.dest.at];
}
function syncRoute(fit = true) {
  if (!map) return;
  if (!map.isStyleLoaded()) { map.once('idle', () => syncRoute(fit)); return; }
  const pts = routePoints();
  const data = { type: 'FeatureCollection', features: pts.length ? [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts } }] : [] };
  if (map.getSource('route')) map.getSource('route').setData(data);
  else {
    map.addSource('route', { type: 'geojson', data });
    map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#2B44F0', 'line-width': 4 } });
  }
  if (!fit) return; // під час руху оновлюється лише лінія; мітки й масштаб змінюються при зміні етапу
  routeMarkers.forEach(m => m.remove());
  routeMarkers = [];
  const L = state.live;
  if (!L) return;
  const toClient = L.phase === 'to_client' || L.phase === 'at_client';
  if (!toClient) routeMarkers.push(new mapboxgl.Marker({ element: pin('venue', '🍴') }).setLngLat(L.venue.at).addTo(map));
  routeMarkers.push(new mapboxgl.Marker({ element: pin('client', '👤') }).setLngLat(L.dest.at).addTo(map));
  const b = new mapboxgl.LngLatBounds();
  pts.forEach(p => b.extend(p));
  map.fitBounds(b, { padding: { top: 120, bottom: 340, left: 60, right: 60 }, maxZoom: 16, duration: 700 });
}

const cleanProfile = q => ({ first: String(q.first || ''), last: String(q.last || ''), phone: String(q.phone || '') });
// зберігаємо в localStorage (у try/catch: сховище може бути недоступне)
function loadProfile() {
  selectProfile(0);
  try {
    const d = JSON.parse(localStorage.getItem(PROFILE_KEY));
    if (d && Array.isArray(d.list) && d.list.length) {
      state.profiles = d.list.slice(0, 3).map(cleanProfile);
      selectProfile(Math.min(Math.max(d.active | 0, 0), state.profiles.length - 1));
    } else {
      const old = JSON.parse(localStorage.getItem('fastcourier.profile')); // профіль зі старої версії
      if (old && old.first) Object.assign(state.profile, cleanProfile(old));
    }
  } catch (e) { /* сховище недоступне */ }
}
function saveProfile() {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify({ list: state.profiles, active: state.active })); } catch (e) { /* ігноруємо */ }
}
// беремо значення з полів форми; false, якщо дані некоректні
function submitProfile() {
  const val = n => document.querySelector('.pform [name="' + n + '"]').value.trim();
  const first = val('first'), last = val('last'), phone = val('phone');
  if (!first || !last) { toast('Вкажіть ім’я та прізвище'); return false; }
  if (phone.replace(/\D/g, '').length < 10) { toast('Вкажіть коректний номер телефону'); return false; }
  if (state.adding && state.profiles.length >= 3) { toast('Можна мати до 3 профілів'); return false; }
  if (state.adding) {
    state.profiles.push({ first, last, phone });
    selectProfile(state.profiles.length - 1);
  } else {
    Object.assign(state.profile, { first, last, phone });
  }
  state.editing = false;
  state.adding = false;
  saveProfile();
  toast('Профіль збережено');
  return true;
}
function deleteProfile() {
  if (state.profiles.length < 2) return;
  state.profiles.splice(state.active, 1);
  selectProfile(Math.max(0, state.active - 1));
  saveProfile();
  toast('Профіль видалено');
}

const fmtMoney2 = n => new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + ' ₴';
const fmtDate = d => d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/\s*р\.$/, '') + ' р.';
const fmtShort = d => d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });
const pad2 = n => String(n).padStart(2, '0');
const fmtDM = d => pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1);
const fmtHM = m => pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
const parseMoney = s => {
  const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
  return Number.isFinite(n) && n >= 0 && n <= 99999 ? Math.round(n * 100) / 100 : null;
};
// детермінований генератор випадкових чисел: одна й та сама дата дає ті самі замовлення
const rng = seed => () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
// вигадані заклади разом з адресою в одному списку; щоб додати чи замінити заклад, достатньо змінити цей масив

const DAY_OFFSETS = [0, 1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 15]; // 12 днів із природними пропусками
const dayKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

// дні історії: кількість замовлень і сума за замовчуванням генеруються, правки з «Налаштувань» накладаються зверху
function buildDays() {
  const base = new Date();
  base.setHours(12, 0, 0, 0);
  return DAY_OFFSETS.map(off => {
    const date = new Date(base);
    date.setDate(base.getDate() - off);
    const key = dayKey(date), seed = Number(key.replace(/-/g, ''));
    const r = rng(seed);
    const count0 = 2 + Math.floor(r() * 8);
    const total0 = Math.round(count0 * (62 + r() * 40) * 100) / 100;
    const ov = state.finance.days[key] || {};
    return { off, key, date, seed, count: ov.count ?? count0, total: ov.total ?? total0 };
  });
}
// замовлення дня: суми підганяються так, щоб у сумі дати рівно total
function dayOrders(day) {
  const r = rng(day.seed * 7 + 1), n = day.count;
  const w = Array.from({ length: n }, () => 0.6 + r());
  const sw = w.reduce((a, b) => a + b, 0);
  const cents = Math.round(day.total * 100);
  let left = cents;
  const amounts = w.map((x, i) => {
    const c = i === n - 1 ? left : Math.round(cents * x / sw);
    left -= c;
    return c / 100;
  });
  // час замовлень: з 12:00 до 23:00, рівномірно з «живим» розкидом і проміжком не менше 12 хвилин
  const now = new Date(), start = 12 * 60, limit = 23 * 60 - 1;
  const end = day.off === 0 ? Math.min(Math.max(now.getHours() * 60 + now.getMinutes(), start + 12 * n), limit) : limit;
  const slot = (end - start) / Math.max(n, 1);
  const asc = [];
  for (let i = 0; i < n; i++) {
    const t = Math.round(start + slot * (i + 0.15 + r() * 0.7));
    asc.push(Math.min(end, Math.max(t, i ? asc[i - 1] + 12 : start)));
  }
  const times = asc.reverse();
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  return amounts.map((amount, i) => ({
    venue: VENUES[Math.floor(r() * VENUES.length)],
    amount, minutes: times[i],
    code: '#' + Array.from({ length: 5 }, () => chars[Math.floor(r() * chars.length)]).join('')
  }));
}

/* ---------- Нове замовлення: від пропозиції до «Доставлено» (вигадані дані) ---------- */
const CLIENTS = ['Інна К.', 'Максим Т.', 'Олена Д.', 'Артем Л.', 'Софія Р.', 'Денис Ж.'];
const CLIENT_STREETS = ['вул. Лісова', 'вул. Озерна', 'просп. Миру', 'вул. Паркова', 'вул. Зарічна'];
const DISHES = ['Бургер «Класик»', 'Картопля фрі', 'Соус сирний', 'Кола 0,5 л', 'Рол «Філадельфія»', 'Суп місо', 'Піца «Маргарита»', 'Чізкейк', 'Лате 0,3 л'];
const MIN_PER_KM = { foot: 12, bike: 4, ebike: 3.2, scooter: 3, moto: 2.4, car: 2.6 }; // хвилин на 1 км залежно від способу доставки
let offerTimer = null, readyTimer = null, slBlock = 0;
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const kmBetween = (a, b) => Math.hypot((a[0] - b[0]) * 111.32 * Math.cos(a[1] * Math.PI / 180), (a[1] - b[1]) * 110.57);
const shift = (p, km) => {
  const ang = Math.random() * 2 * Math.PI;
  return [p[0] + Math.cos(ang) * km / (111.32 * Math.cos(p[1] * Math.PI / 180)), p[1] + Math.sin(ang) * km / 110.57];
};
const homeRoute = () => ['', '#/'].includes(location.hash);
const renderLive = () => { if (homeRoute()) render(); }; // таймери не перемальовують інші екрани (щоб не збити форму)

function newOrder() {
  const v = pick(VENUES), cut = v.indexOf(', ');
  const from = hereLL(), venueAt = shift(from, rnd(0.5, 1.4)), destAt = shift(venueAt, rnd(0.9, 2.2));
  const k1 = kmBetween(from, venueAt), k2 = kmBetween(venueAt, destAt), mpk = MIN_PER_KM[state.vehicle] || 4;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'.split('');
  return {
    code: '#' + Array.from({ length: 5 }, () => pick(chars)).join(''),
    client: pick(CLIENTS),
    venue: { name: v.slice(0, cut), address: v.slice(cut + 2), at: venueAt },
    dest: { address: pick(CLIENT_STREETS) + ', ' + Math.floor(rnd(1, 90)), at: destAt, instr: 'Зустрінемося біля дверей', note: 'Залиште біля дверей', landmark: 'багатоквартирний будинок', entrance: Math.floor(rnd(1, 5)), floor: Math.floor(rnd(1, 10)) },
    items: DISHES.slice().sort(() => Math.random() - 0.5).slice(0, 3),
    toVenue: Math.max(2, Math.round(k1 * mpk)), toClient: Math.max(2, Math.round(k2 * mpk)),
    fee: Math.round((38 + (k1 + k2) * 14 + rnd(0, 20)) * 100) / 100,
    phase: 'offer', ready: false, revealed: false
  };
}
function setLive(L) {
  state.live = L; state.expanded = false; state.itemsOpen = false; state.orderEdit = false;
  syncRoute();
  renderLive();
}
// пошук замовлень: через кілька секунд після виходу онлайн приходить нова пропозиція
function scheduleOffer(delay) {
  clearTimeout(offerTimer);
  if (!state.online || state.live) return;
  offerTimer = setTimeout(() => {
    if (!state.online || state.live) return;
    setLive(newOrder());
    if (!homeRoute()) toast('Нове замовлення');
  }, delay || rnd(5000, 9000));
}
const cancelOffer = () => clearTimeout(offerTimer);
function decline() {
  setLive(null);
  toast('Замовлення відхилено');
  scheduleOffer(rnd(8000, 12000));
}
// наступний крок: пропозиція → до закладу → у закладі → до клієнта → у клієнта → виконано
function liveNext() {
  const L = state.live;
  if (!L) return;
  state.orderEdit = false;
  if (L.phase === 'offer') { L.phase = 'to_venue'; toast('Замовлення прийнято'); }
  else if (L.phase === 'to_venue') {
    L.phase = 'at_venue'; L.revealed = true; // ім’я клієнта й номер відкриваються, коли курʼєр на місці
    clearTimeout(readyTimer);
    readyTimer = setTimeout(() => { if (state.live === L) { L.ready = true; renderLive(); } }, rnd(8000, 14000));
  }
  else if (L.phase === 'at_venue' && L.ready) { L.phase = 'to_client'; state.expanded = false; }
  else if (L.phase === 'to_client') L.phase = 'at_client';
  else if (L.phase === 'at_client') return finishOrder();
  else return;
  syncRoute();
  renderLive();
}
function finishOrder() {
  const L = state.live;
  state.finance.done.push({ ts: Date.now(), code: L.code, venue: L.venue.name + ', ' + L.venue.address, amount: L.fee });
  saveFinance();
  setLive(null);
  toast('Замовлення виконано');
  scheduleOffer(rnd(8000, 12000));
}

  const L = state.live;
  if (L.phase === 'offer') {
    return '<button class="decline" data-act="decline">Відхилити</button>' +
      '<div class="ocard"><div class="orow"><span class="oi">🍴</span><div><b>' + esc(L.venue.name) + '</b><span>' + esc(L.venue.address) + '</span><small>~' + L.toVenue + ' хв</small></div></div>' +
      '<div class="orow"><span class="oi">👤</span><div><small>~' + L.toClient + ' хв</small></div></div>' +
      '<button class="btn round" data-act="accept">' + (L.toVenue + L.toClient) + ' хв, ' + fmtMoney2(L.fee) + '</button></div>';
  }
  const toClient = L.phase === 'to_client' || L.phase === 'at_client';
  const who = '<b>' + (L.revealed ? esc(L.client) + ' ' + esc(L.code) : '***** *****') + '</b>';
  const chips = toClient
    ? '<span class="chip2">Доставлено через <b>' + L.toClient + ' хв</b></span>'
    : '<span class="chip2' + (L.ready ? ' ok' : '') + '">' + (L.ready ? 'Замовлення готове до отримання' : 'Замовлення готується') + '</span>' +
      (L.phase === 'to_venue' ? '<span class="chip2">Прибуде за <b>' + L.toVenue + ' хв</b></span>' : '<span class="chip2 ok">На місці</span>');
  const items = '<div class="orow2">Товари (' + L.items.length + ')<button class="lnk" data-act="items-open">Переглянути' + chev + '</button></div>';
  const help = '<div class="hcard"><b>Проблеми з доставкою?</b><button class="lnk2" data-act="help">Отримати допомогу' + chev + '</button></div>';
  const canEdit = L.phase === 'at_venue' && L.ready; // тимчасово, для тестування
  const editForm = '<div class="pform"><label>Ім’я клієнта<input name="oname" value="' + esc(L.client) + '" maxlength="30"></label>' +
    '<label>Номер замовлення<input name="ocode" value="' + esc(L.code.slice(1)) + '" maxlength="8" autocapitalize="characters"></label>' +
    '<div class="pbtns"><button class="btn ghost" data-act="order-cancel">Скасувати</button><button class="btn" data-act="order-save">Зберегти</button></div></div>';
  const whoBlock = canEdit && state.orderEdit ? editForm : who + (canEdit ? '<button class="lnk call" data-act="order-edit">Змінити ім’я та номер (тест)</button>' : '');
  let head, details;
  if (!toClient) {
    head = '<b>' + esc(L.venue.name) + '</b><span>' + esc(L.venue.address) + '</span>';
    details = '<button class="lnk call" data-act="call">Подзвонити</button><div class="blk"><div>Готові замовлення: ' + (L.ready ? 1 : 0) + '</div>' + whoBlock + items + '</div>' + help;
  } else {
    const d = L.dest;
    head = who + '<span>' + esc(d.address) + '</span>';
    details = '<div class="blk">' + who + items + '</div><dl class="info2"><dt>Адреса</dt><dd>' + esc(d.address) + '</dd><dt>Інструкції</dt><dd>' + esc(d.instr) +
      '</dd><dt>Примітка</dt><dd>' + esc(d.note) + '</dd><dt>Орієнтир</dt><dd>' + esc(d.landmark) + '</dd><dt>Під’їзд</dt><dd>' + d.entrance + '</dd><dt>Поверх</dt><dd>' + d.floor + '</dd></dl>' +
      '<div class="calls"><button data-act="call"><span>📞</span>Подзвонити</button><button data-act="chat"><span>💬</span>Чат</button></div>' + help;
  }
  let foot;
  if (L.phase === 'to_venue') foot = slider('На місці');
  else if (L.phase === 'at_venue') foot = L.ready ? slider('Видано') : '<p class="wait"><i class="spin"></i>Зачекайте, поки замовлення буде готове</p>';
  else foot = slider(L.phase === 'to_client' ? 'На місці' : 'Доставлено');
  return '<div class="osheet' + (state.expanded ? ' exp' : '') + '"><button class="grab" data-act="sheet-toggle" aria-label="Розгорнути або згорнути картку замовлення"></button>' +
    '<div class="osum" data-act="sheet-toggle"><div class="chips">' + chips + '</div>' + head + '</div><div class="odet">' + details + '</div><div class="ofoot">' + foot + '</div></div>' +
    (state.itemsOpen ? itemsModal(L) : '');
}

// «Великі цифри»: коли замовлення вже готове, але ще не видане, номер і ім’я на весь екран.
// Працює й при вимкненому автоповороті: нахил телефона береться з акселерометра, і екран повертається програмно
function bigDigits() {
  const L = state.live;
  if (!(L && L.phase === 'at_venue' && L.ready)) return '';
  if (!state.tilt && !state.landscape) return '';
  const portrait = innerHeight >= innerWidth;
  const rot = state.tilt && portrait ? (state.tilt > 0 ? ' rot90' : ' rotm90') : '';
  return '<div class="bigd' + rot + '" aria-label="Великі цифри"><span>' + esc(L.code.slice(1)) + '</span><b>' + esc(L.client) + '</b></div>';
}
const FLIP = /iPhone|iPad|iPod/.test(navigator.userAgent) ? -1 : 1; // в iOS знак осі протилежний
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const x = a.x * FLIP;
  const t = x > 6 ? 90 : x < -6 ? -90 : Math.abs(x) < 3 ? 0 : state.tilt; // між 3 і 6 лишаємо попереднє значення
  if (t !== state.tilt) { state.tilt = t; renderLive(); }
}
let motionOn = false;
function enableMotion(gesture) {
  if (motionOn || !('DeviceMotionEvent' in window)) return;
  const req = DeviceMotionEvent.requestPermission;
  if (typeof req === 'function') {
    if (!gesture) return; // iOS питає дозвіл лише після дотику
    motionOn = true;
    req.call(DeviceMotionEvent).then(r => { if (r === 'granted') window.addEventListener('devicemotion', onMotion); }).catch(() => {});
  } else { motionOn = true; window.addEventListener('devicemotion', onMotion); }
}
// тимчасово, для тестування: правка імені клієнта й номера, коли замовлення вже готове
function saveOrderEdit() {
  const L = state.live;
  if (!L) return false;
  const name = document.querySelector('[name="oname"]').value.trim();
  const code = document.querySelector('[name="ocode"]').value.trim().replace(/^#/, '').toUpperCase();
  if (!name) { toast('Вкажіть ім’я клієнта'); return false; }
  if (!/^[A-Z0-9]{3,8}$/.test(code)) { toast('Номер: 3–8 літер або цифр'); return false; }
  L.client = name; L.code = '#' + code; state.orderEdit = false;
  toast('Збережено');
  return true;
}

function render() {
  const h = location.hash;
  const m = h.match(/^#\/order\/(\d+)/);
  const order = m && byId(Number(m[1]));
  const home = !order && !['#/orders', '#/setup', '#/vehicle', '#/settings', '#/deliveries', '#/cash', '#/pay'].includes(h);
  if (h !== '#/vehicle') state.draft = null; else if (state.draft == null) state.draft = state.vehicle;
  if (!home) state.dialog = false;
  if (h !== '#/menu') { state.editing = false; state.adding = false; }
  if (h !== '#/pay') state.payMethod = null;
  document.body.classList.toggle('map-mode', home);
  document.getElementById('map').classList.toggle('off', !home);
  root.innerHTML = order ? viewDetail(order) : h === '#/orders' ? viewList() : h === '#/setup' ? viewSetup() : h === '#/vehicle' ? viewVehicle() : h === '#/menu' ? viewHome() + viewMenu(!prevHash || prevHash === '#/') : h === '#/settings' ? viewSettings() : h === '#/deliveries' ? viewDeliveries() : h === '#/cash' ? viewCash() : h === '#/pay' ? viewPay() : viewHome();
  prevHash = h;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (Date.now() < slBlock) return;
  enableMotion(true);
  const { act, id, tab } = b.dataset;
  if (act === 'tab') state.tab = tab;
  if (act === 'online') location.hash = '#/setup';
  if (act === 'offline') askOffline();
  if (act === 'offline-yes') { state.online = false; state.dialog = false; cancelOffer(); toast('Ви офлайн'); }
  if (act === 'dialog-no') state.dialog = false;
  if (act === 'soon') return toast('Розділ ще в розробці');
  if (act === 'edit-profile') { state.editing = true; state.adding = false; }
  if (act === 'edit-cancel') { state.editing = false; state.adding = false; }
  if (act === 'edit-save' && !submitProfile()) return;
  if (act === 'pick') { state.adding = false; selectProfile(Number(id)); saveProfile(); }
  if (act === 'add-profile') state.adding = true;
  if (act === 'del-profile') deleteProfile();
  if (act === 'cash-done' && !saveCash()) return;
  if (act === 'add-card') return toast('У демо-версії недоступно');
  if (act === 'pay-now') payDebt();
  if (act === 'accept') liveNext();
  if (act === 'decline') decline();
  if (act === 'slide-confirm') { if (e.detail === 0) liveNext(); else toast('Проведіть вправо, щоб підтвердити'); return; } // e.detail === 0: натискання з клавіатури
  if (act === 'sheet-toggle') {
    state.expanded = !state.expanded;
    const sh = document.querySelector('.osheet');
    if (sh) sh.classList.toggle('exp', state.expanded);
    return;
  }
  if (act === 'order-edit') { state.orderEdit = true; state.expanded = true; }
  if (act === 'order-cancel') state.orderEdit = false;
  if (act === 'order-save' && !saveOrderEdit()) return;
  if (act === 'items-open') state.itemsOpen = true;
  if (act === 'items-close') state.itemsOpen = false;
  if (['report', 'help', 'call', 'chat'].includes(act)) return toast('У демо-версії недоступно');
  if (act === 'locate') return recenter();
  if (act === 'check') { if (id === '2') state.checks[2].ok = !state.checks[2].ok; else startWatch(); }
  if (act === 'confirm') { state.online = true; location.hash = '#/'; toast('Ви на лінії'); scheduleOffer(); }
  if (act === 'save-vehicle') { state.vehicle = state.draft; location.hash = '#/setup'; toast('Спосіб доставки збережено'); }
  if (act === 'advance') advance(Number(id));
  if (act === 'reject') reject(Number(id));
  render();
  // після перемальовування повертаємо фокус на той самий елемент (важливо для клавіатури)
  const sel = '[data-act="' + act + '"]' + (tab ? '[data-tab="' + tab + '"]' : '') + (id ? '[data-id="' + id + '"]' : '');
  const again = root.querySelector('[role="alertdialog"] button') || (act === 'add-profile' && root.querySelector('.pform input')) || root.querySelector(sel) || root.querySelector('.pform input') || root.querySelector('[data-act="edit-profile"]');
  if (again) again.focus();
});

// вибір способу доставки (нативні radio)
document.addEventListener('change', e => {
  if (!e.target.matches('input[name="vehicle"]')) return;
  state.draft = e.target.value;
  render();
  root.querySelector('input[name="vehicle"]:checked').focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.itemsOpen) { state.itemsOpen = false; render(); return; }
  if (e.key === 'Escape' && state.dialog) { state.dialog = false; render(); }
  if (e.key === 'Escape' && state.editing) { state.editing = false; state.adding = false; render(); return; }
  if (e.key === 'Escape' && location.hash === '#/menu') location.hash = '#/';
  if (e.key === 'Enter' && e.target.matches('input[name^="o"]')) { if (saveOrderEdit()) render(); return; }
  if (e.key === 'Enter' && e.target.matches('.pform input') && submitProfile()) render();
});

// вибір геолокації: точка користувача переміщується, карта центрується на ній
document.addEventListener('change', e => {
  if (!e.target.matches('input[name="location"]')) return;
  state.location = e.target.value;
  flyToMe();
  toast('Геолокацію змінено: ' + here().name);
  render();
  root.querySelector('input[name="location"]:checked').focus();
});

// повзунки підтвердження: потягни білу кнопку вправо до кінця
let sl = null;
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('.knob');
  if (!k) return;
  sl = { k, x0: e.clientX, dx: 0, max: k.parentElement.clientWidth - k.offsetWidth - 12 };
  k.setPointerCapture(e.pointerId);
  k.style.transition = 'none';
});
document.addEventListener('pointermove', e => {
  if (!sl) return;
  sl.dx = Math.min(sl.max, Math.max(0, e.clientX - sl.x0));
  sl.k.style.transform = 'translateX(' + sl.dx + 'px)';
});
document.addEventListener('pointerup', () => {
  if (!sl) return;
  const { k, dx, max } = sl;
  sl = null;
  if (dx > 5) slBlock = Date.now() + 400; // клік після перетягування ігноруємо
  if (dx > max * 0.8) liveNext();
  else { k.style.transition = 'transform .2s'; k.style.transform = ''; }
});
document.addEventListener('pointercancel', () => { if (sl) { sl.k.style.transform = ''; sl = null; } });

// шторка: потягни за ручку чи заголовок вгору (розгорнути) або вниз (згорнути); короткий дотик перемикає її кліком
let sd = null;
document.addEventListener('pointerdown', e => { if (e.target.closest('.grab, .osum')) sd = { y0: e.clientY, dy: 0 }; });
document.addEventListener('pointermove', e => { if (sd) sd.dy = e.clientY - sd.y0; });
document.addEventListener('pointerup', () => {
  if (!sd) return;
  const dy = sd.dy;
  sd = null;
  if (Math.abs(dy) < 12) return;
  slBlock = Date.now() + 400; // клік після жесту ігноруємо
  state.expanded = dy < 0;
  const sh = document.querySelector('.osheet');
  if (sh) sh.classList.toggle('exp', state.expanded);
});
document.addEventListener('pointercancel', () => { sd = null; });

// вибір способу оплати
document.addEventListener('change', e => {
  if (!e.target.matches('input[name="pay"]')) return;
  state.payMethod = e.target.value;
  render();
  root.querySelector('input[name="pay"]:checked').focus();
});

// «Налаштування»: правка заробітку й кількості замовлень за день
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.matches('[data-day]')) return;
  const n = Number(t.value);
  if (t.value === '' || !Number.isFinite(n)) { render(); return; }
  const day = state.finance.days[t.dataset.day] || (state.finance.days[t.dataset.day] = {});
  if (t.dataset.field === 'count') day.count = Math.min(30, Math.max(0, Math.round(n)));
  else day.total = Math.min(99999, Math.max(0, Math.round(n * 100) / 100));
  t.value = day[t.dataset.field];
  saveFinance();
});

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
loadProfile();
loadFinance();
const landscapeMq = matchMedia('(orientation: landscape) and (max-height: 500px)'); // телефон на боці
state.landscape = landscapeMq.matches;
landscapeMq.addEventListener('change', e => { state.landscape = e.matches; renderLive(); });
enableMotion(false);
render();
initMap();
startWatch();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
